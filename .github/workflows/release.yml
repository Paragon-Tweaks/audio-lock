name: CI & Manual Unsigned Release

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.2.0). Defaults to Cargo.toml version if omitted."
        required: false
        type: string
      publish_draft:
        description: "Also upload unsigned assets to a draft GitHub Release (never overwrites signed releases)."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  check:
    name: Clippy & Tests
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run workspace clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace

  # Signed production releases are built, Authenticode-signed with the hardware token,
  # and published locally via scripts/build-release.ps1.
  # Pushing a v* tag intentionally does NOT trigger this job so CI can never race
  # or overwrite locally signed release assets with unsigned binaries.
  manual-unsigned-release:
    name: Manual Unsigned Release Packaging
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: check
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Resolve release version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:INPUT_VERSION)) {
            $ver = $env:INPUT_VERSION.Trim() -replace '^[vV]', ''
          } else {
            $cargo = Get-Content -Path "Cargo.toml" -Raw
            if ($cargo -match '(?ms)^\[workspace\.package\]\s*\r?\n(.*?)(?=^\[|\z)' -and $Matches[1] -match '(?m)^\s*version\s*=\s*"([^"]+)"') {
              $ver = $Matches[1].Trim()
            } else {
              throw "Could not read [workspace.package].version from Cargo.toml"
            }
          }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=v$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build & package unsigned release assets
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          .\scripts\build-release.ps1 `
            -Version $env:RELEASE_VERSION `
            -GithubRepo $env:GITHUB_REPO `
            -Unsigned `
            -NoPublish `
            -SkipTests

          $expected = @(
            "dist\DefaultAudioLock-Setup-$($env:RELEASE_VERSION).exe",
            "dist\default-audio-lock-win64-update.zip",
            "dist\manifest.json"
          )
          foreach ($file in $expected) {
            if (-not (Test-Path -LiteralPath $file)) {
              throw "Expected unsigned release artifact was not produced: $file"
            }
          }

      - name: Upload unsigned workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: audio-lock-unsigned-v${{ steps.version.outputs.version }}
          path: |
            dist/DefaultAudioLock-Setup-*.exe
            dist/default-audio-lock-win64-update.zip
            dist/manifest.json
          if-no-files-found: error

      - name: Publish unsigned draft GitHub Release (optional)
        if: ${{ inputs.publish_draft == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Audio Lock ${{ steps.version.outputs.tag }} (Unsigned Draft)
          draft: true
          generate_release_notes: true
          files: |
            dist/DefaultAudioLock-Setup-*.exe
            dist/default-audio-lock-win64-update.zip
            dist/manifest.json
