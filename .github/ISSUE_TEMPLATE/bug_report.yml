name: Bug Report
description: Report a bug or unexpected behavior in Audio Lock
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue with Audio Lock. Please include the details below so we can reproduce it cleanly.
  - type: input
    id: app-version
    attributes:
      label: App Version
      description: Version shown in the flyout or installer filename (e.g., v0.1.0)
      placeholder: "v0.1.0"
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows Version & Build
      description: Run `winver` or check System > About (e.g., Windows 11 24H2 Build 26100)
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: dropdown
    id: stripped-os
    attributes:
      label: Stripped / Tweaked Windows Install?
      description: Let us know if you are running a custom/debloated ISO or heavy OS tweaks.
      options:
        - "No (Stock Windows 10 / 11)"
        - "Yes (Custom ISO / Stripped / Debloated)"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: audio-devices
    attributes:
      label: Audio Devices Involved
      description: List the playback/recording devices, USB DACs, or virtual audio cables involved.
      placeholder: |
        - Playback: ...
        - Recording: ...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps to trigger the issue, plus what you expected vs. what happened.
      placeholder: |
        1. ...
        2. ...
        3. ...

        Expected: ...
        Actual: ...
    validations:
      required: true
