name: Feature Request
description: Suggest an improvement or new capability for Audio Lock
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What would you like to see?
      description: Describe the feature or improvement clearly.
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Why is this useful?
      description: Explain your audio setup or workflow and how this would help.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Additional Context
      description: Optional notes, screenshots, or edge cases to keep in mind.
    validations:
      required: false
