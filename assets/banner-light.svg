<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="260" viewBox="0 0 1280 260" role="img" aria-label="Paragon Tweaks - Open-Source Quality of Life Tools for Windows">
  <defs>
    <linearGradient id="bg-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FAFAFA" />
      <stop offset="100%" stop-color="#F3F3F3" />
    </linearGradient>
    <radialGradient id="glow-light" cx="50%" cy="34%" r="55%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="line-fade-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DCDCDC" stop-opacity="0" />
      <stop offset="50%" stop-color="#C8C8C8" stop-opacity="1" />
      <stop offset="100%" stop-color="#DCDCDC" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Card Surface -->
  <rect x="0.5" y="0.5" width="1279" height="259" rx="16" fill="url(#bg-light)" stroke="#DCDCDC" stroke-width="1" />
  <rect x="1" y="1" width="1278" height="258" rx="15.5" fill="url(#glow-light)" />

  <!-- Subtle Technical Corner Marks -->
  <g stroke="#D2D2D2" stroke-width="1" fill="none">
    <path d="M 24 36 L 24 24 L 36 24" />
    <path d="M 1244 24 L 1256 24 L 1256 36" />
    <path d="M 24 224 L 24 236 L 36 236" />
    <path d="M 1244 236 L 1256 236 L 1256 224" />
  </g>

  <!-- Subtle Framing Hairlines -->
  <line x1="200" y1="68" x2="588" y2="68" stroke="url(#line-fade-light)" stroke-width="1" />
  <line x1="692" y1="68" x2="1080" y2="68" stroke="url(#line-fade-light)" stroke-width="1" />

  <!-- Geometric Paragon Mark -->
  <g transform="translate(640, 68)">
    <polygon points="0,-24 21,-12 21,12 0,24 -21,12 -21,-12" fill="none" stroke="#121212" stroke-width="1.75" stroke-linejoin="miter" />
    <polygon points="0,-13 11,0 0,13 -11,0" fill="#121212" />
    <polygon points="0,-6 5,0 0,6 -5,0" fill="#FAFAFA" />
    <line x1="0" y1="-24" x2="0" y2="-13" stroke="#B0B0B0" stroke-width="1" />
    <line x1="0" y1="13" x2="0" y2="24" stroke="#B0B0B0" stroke-width="1" />
  </g>

  <!-- Primary Wordmark -->
  <text
    x="640"
    y="156"
    text-anchor="middle"
    fill="#121212"
    font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
    font-size="38"
    font-weight="700"
    letter-spacing="11"
  >PARAGON TWEAKS</text>

  <!-- Subtle Subtitle Divider -->
  <line x1="460" y1="176" x2="820" y2="176" stroke="url(#line-fade-light)" stroke-width="1" />

  <!-- Subtitle -->
  <text
    x="640"
    y="206"
    text-anchor="middle"
    fill="#666666"
    font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
    font-size="13"
    font-weight="500"
    letter-spacing="4"
  >OPEN-SOURCE QUALITY OF LIFE TOOLS FOR WINDOWS</text>
</svg>
